name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: docker build -t todo-mcp:ci .
      - run: python3 scripts/smoke.py
      - run: cargo run --release --locked --example benchmark
      - name: Container health and unauthorized-access smoke
        run: |
          docker run --rm -d --network host --name todo-smoke \
            -e TODO_BIND=127.0.0.1:18080 \
            -e TODO_PUBLIC_URL=http://127.0.0.1:18080 \
            -e TODO_ADMIN_TOKEN=synthetic-admin-token-01234567890123 \
            -e TODO_DEV_MCP_TOKEN=synthetic-client-token-01234567890123 \
            -e TODO_ENCRYPTION_KEY=0101010101010101010101010101010101010101010101010101010101010101 \
            -e MICROSOFT_CLIENT_ID=00000000-0000-0000-0000-000000000001 \
            todo-mcp:ci
          trap 'docker logs todo-smoke; docker stop todo-smoke' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/mcp)" = 401
